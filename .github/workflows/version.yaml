name: version

# Once the checks workflow passes on a push to main, works out whether the
# commits since the last `v*` tag make a release, from their conventional
# commit titles. If they do, the release bot commits `chore: release v<version>`
# to main with the new version in Cargo.toml and Cargo.lock and the notes in
# CHANGELOG.md, then pushes the tag `v<version>`, which starts the release
# workflow. See scripts/release.sh. Run it by hand to retry a failed release.
on:
  workflow_run:
    workflows:
      - checks
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

# The job token can only read. Every write goes through the release bot's token.
permissions:
  contents: read

# Runs one at a time and never cancels a run that may be halfway through
# pushing a release.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  release:
    # Only checks that passed on a push to main in this repository count. The
    # bot's own release commit starts the checks again and is skipped here;
    # only a commit pushed by a bot is skipped, so a pull request title that
    # looks like one still runs. A run by hand must be on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !(startsWith(github.event.workflow_run.head_commit.message, 'chore: release v') &&
      github.event.workflow_run.actor.type == 'Bot'))
    runs-on: ubuntu-24.04
    # The release bot's secrets live in this environment, which only main can
    # use, so a workflow on another branch can't get the bot's token.
    environment: release
    steps:
      # Until the release bot's secrets are set, the run passes with a notice
      # instead of failing every merge.
      - name: Check for the release bot
        id: bot
        env:
          HAS_SECRETS: ${{ secrets.RELEASE_BOT_APP_ID != '' && secrets.RELEASE_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_SECRETS}" = "true" ]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::RELEASE_BOT_APP_ID and RELEASE_BOT_PRIVATE_KEY aren't set in the release environment, so nothing is released"
          fi

      # A tag pushed with the job token wouldn't start the release workflow, so
      # the push uses a token of the release bot app, limited to this repository
      # and to its contents. `client-id` takes the App ID as well.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.bot.outputs.ready == 'true'
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Checks out the commit the checks passed on. If main has moved on since,
      # semantic-release sees the branch is behind and releases nothing; the
      # newer commit's own run releases once its checks pass. The full history
      # and tags are needed to find the last release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.bot.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.bot.outputs.ready == 'true'
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      # Installs the exact versions in package-lock.json, without running any
      # package install scripts.
      - name: Install semantic-release
        if: steps.bot.outputs.ready == 'true'
        working-directory: .github/release
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Release
        if: steps.bot.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: scripts/release.sh
