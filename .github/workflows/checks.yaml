name: checks

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main
  # Daily re-check of main, so an advisory published after the last merge
  # still gets caught. Off the hour because GitHub delays busy cron slots.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Every job gets read-only access unless it asks for more below.
permissions:
  contents: read

# Shared workflows are pinned to a commit so a change upstream can't run here
# until someone bumps the pin. Only the security scan gets secrets, and only
# the three it needs.
jobs:
  audit:
    uses: affinidi/pipeline-rust/.github/workflows/audit.yaml@cc92894cfbd5ebe38eee9e7edb5e54addf369a02
    permissions:
      contents: read
      issues: write

  cargo-deny:
    uses: affinidi/pipeline-rust/.github/workflows/cargo-deny.yaml@cc92894cfbd5ebe38eee9e7edb5e54addf369a02

  check:
    uses: affinidi/pipeline-rust/.github/workflows/cargo-check.yaml@cc92894cfbd5ebe38eee9e7edb5e54addf369a02
    with:
      toolchain: '1.96.0'
      rustflags: '-D warnings'

  test:
    uses: affinidi/pipeline-rust/.github/workflows/test.yaml@cc92894cfbd5ebe38eee9e7edb5e54addf369a02
    with:
      toolchain: '1.96.0'
      rustflags: '-D warnings'
      useRedis: false

  fmt:
    uses: affinidi/pipeline-rust/.github/workflows/fmt.yaml@cc92894cfbd5ebe38eee9e7edb5e54addf369a02
    with:
      toolchain: '1.96.0'
      rustflags: '-D warnings'

  clippy:
    uses: affinidi/pipeline-rust/.github/workflows/clippy.yaml@cc92894cfbd5ebe38eee9e7edb5e54addf369a02
    with:
      toolchain: '1.96.0'
      rustflags: '-D warnings'

  rust-scan:
    # Pull requests from forks don't get repository secrets, so the scan would
    # fail on them. Forks are scanned once their change reaches main.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: affinidi/pipeline-security/.github/workflows/rust-scanner.yml@0ca1f3d0e4da833304b3474dbb27942b64501932
    secrets:
      SNYK_SCANNER_TOKEN: ${{ secrets.SNYK_SCANNER_TOKEN }}
      SNYK_SCANNER_REGION: ${{ secrets.SNYK_SCANNER_REGION }}
      SNYK_GLOBAL_POLICY: ${{ secrets.SNYK_GLOBAL_POLICY }}

  coverage:
    uses: affinidi/pipeline-rust/.github/workflows/coverage.yaml@cc92894cfbd5ebe38eee9e7edb5e54addf369a02
    with:
      toolchain: '1.96.0'
      rustflags: '-D warnings'
      coverage: 80
      useRedis: false

  # The `agent-stream` Cargo feature is off by default and in releases, so the
  # shared jobs above never build it. This job tests and lints the feature
  # build, then checks that the default binary still rejects `fabric
  # agent-stream`. The shared `test` job already checks that through
  # `the_default_build_does_not_know_agent_stream` in
  # tests/agent_stream_feature.rs, and the last step here repeats it on
  # purpose, so the release guarantee shows up as a check of its own. The
  # shared workflows take no features input, so this job runs cargo directly,
  # with the same toolchain and flags.
  agent-stream:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy
          rustup default 1.96.0

      - name: Test with the feature
        run: cargo test --locked --features agent-stream

      - name: Lint with the feature
        run: cargo clippy --locked --features agent-stream --all-targets

      - name: Build without the feature
        run: cargo build --locked

      - name: The default binary rejects agent-stream
        run: |
          set +e
          stderr="$(target/debug/fabric agent-stream 2>&1 >/dev/null)"
          code=$?
          set -e
          echo "$stderr"
          test "$code" -eq 2
          grep -q "unrecognized subcommand" <<< "$stderr"

  # The release scripts only run on main after a merge, so they are checked
  # here first. shellcheck comes with the runner image.
  release-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Test the release scripts
        run: scripts/test-release-scripts.sh
