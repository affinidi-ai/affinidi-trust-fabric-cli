[graph]
all-features = true
# Only the platforms the CLI ships for. `webpki-root-certs` (CDLA-Permissive-2.0,
# not on the approved list) is only pulled in for wasm32 builds, which the CLI
# never targets.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
# Exactly the approved list in "Affinidi Software License Policies (Closed,
# Open-Source Licenses)". Anything else needs Legal first, so it is added here
# only after they clear it, not as a per-crate exception.
unused-allowed-license = "allow"
allow = [
    # Permissive
    "0BSD",
    "AFL-2.1",
    "Apache-1.1",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "Fair",
    "ISC",
    "Intel",
    "MIT",
    "MIT-0",
    "MIT-Modern-Variant",
    "MirOS",
    "MulanPSL-2.0",
    "Multics",
    "NCSA",
    "Naumen",
    "OFL-1.1",
    "PHP-3.01",
    "PostgreSQL",
    "Python-2.0",
    "UPL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "WTFPL",
    "Zlib",
    # Weak copyleft, approved as long as we don't modify the dependency
    "MPL-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
