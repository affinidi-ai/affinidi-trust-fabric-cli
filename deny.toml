[graph]
all-features = true
# Only the platforms the CLI ships for. `webpki-root-certs` (CDLA-Permissive-2.0,
# not on the approved list) is only pulled in for wasm32 builds, which the CLI
# never targets. Whoever adds a release build target (for example Windows ARM
# or musl Linux) must update this list.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
# Exactly the licenses Affinidi has approved, last synced 2026-10-01.
# Anything else needs Legal first, so it is added here only after they clear it,
# not as a per-crate exception. Unicode-3.0 was cleared by Legal on 2026-10-01.
unused-allowed-license = "allow"
allow = [
    # Permissive
    "0BSD",
    "AFL-2.1",
    "Apache-1.1",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "Fair",
    "ISC",
    "Intel",
    "MIT",
    "MIT-0",
    "MIT-Modern-Variant",
    "MirOS",
    "MulanPSL-2.0",
    "Multics",
    "NCSA",
    "Naumen",
    "OFL-1.1",
    "PHP-3.01",
    "PostgreSQL",
    "Python-2.0",
    "UPL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "WTFPL",
    "Zlib",
    # Weak copyleft, approved as long as we don't modify the dependency. Check
    # new MPL-2.0 crates and any `[patch]` entry in review, as cargo-deny can't.
    "MPL-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
