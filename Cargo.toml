[package]
name = "fabric-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
publish = false
description = "Command-line client for Affinidi appliances, starting with Agent Gateway"
license = "Apache-2.0"

[[bin]]
name = "fabric"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
open = "5"
rand = "0.9"
reqwest = { version = "0.13", features = ["json"] }
rpassword = "7"
rustyline = "17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["time"] }