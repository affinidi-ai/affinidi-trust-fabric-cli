[package]
name = "affinidi-trust-fabric-cli"
version = "0.1.3"
edition = "2024"
rust-version = "1.85.0"
publish = false
description = "Command-line client for Affinidi appliances, starting with Agent Gateway"
license = "Apache-2.0"

[[bin]]
name = "fabric"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
dirs = "6"
# On Linux, the pure Rust Secret Service client, so the binary does not link
# libdbus. Its runtime is async-io, not tokio: keyring's blocking calls would
# otherwise start a tokio runtime inside the CLI's own and panic.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
open = "5"
rand = "0.9"
regex = "1"
regex-syntax = "0.8"
reqwest = { version = "0.13", features = ["json"] }
rpassword = "7"
rustyline = "17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"
url = "2"

# Both already pulled in by keyring; named here only to tell a Secret Service
# that can't be reached over D-Bus apart from other Secret Service errors.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = "4"
zbus = { version = "4", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["time"] }